name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  autotest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # El autotest no usa la red ni el token: corre con respuestas fijas.
      - run: python gespro.py --check
